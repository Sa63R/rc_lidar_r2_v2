/rc_serial_driver:
  ros__parameters:
    can_interface: "can0"        # CAN 接口名称
    can_bitrate: 1000000         # CAN 波特率 (bit/s)
    send_enabled: true
    can_id_frame1: 18    # 0x12 的十进制
    can_id_frame2: 19    # 0x13 的十进制
    can_id_restart: 1911 # 0x777 的十进制
    can_pose_debug_topic: "/rc_serial_driver/can_pose_debug"
    pose_source: "tf"    # tf / pose_topic / raw_odom / auto
    pose_topic: "/lidar/pose"
    pose_topic_timeout_sec: 0.5
    raw_odom_pose_topic: "/Odometry"
    raw_odom_pose_timeout_sec: 0.5
    raw_odom_pose_strict: true
    raw_odom_pose_yaw_offset_rad: 0.0
    raw_odom_apply_robot_extrinsic: true
    raw_odom_lidar_to_base_xyz: [0.237488, -0.272804, -0.483]
    raw_odom_lidar_to_base_rpy: [0.0, 0.0, -1.5707963267948966]
    raw_odom_reference_xyz: [0.237488, -0.272804, -0.483]
    raw_odom_reference_rpy: [0.0, 0.0, -1.5707963267948966]
    yaw_pose_topic_enabled: false
    yaw_pose_topic: "/robot/pose"
    yaw_pose_topic_timeout_sec: 0.5
    yaw_pose_topic_strict: false
    yaw_ignore_quality_gate: true
    restart_enabled: true
    restart_script: "autostart/restart_lidar_stack.sh"
    restart_debounce_sec: 8.0
    timestamp_offset: 0.0         # 时间戳偏移
