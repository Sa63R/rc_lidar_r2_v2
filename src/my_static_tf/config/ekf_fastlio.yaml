ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.02
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: camera_init
    world_frame: camera_init
    base_link_frame: body_highrate

    odom0: /Odometry
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    imu0: /livox/imu
    imu0_queue_size: 50
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]